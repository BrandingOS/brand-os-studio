<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Concept C: "The Grid" — A structured matrix of connected nodes forming an 'R',
       representing Raqm's systematic, precision-driven revenue infrastructure. -->
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7231FF"/>
      <stop offset="100%" stop-color="#5A1EE0"/>
    </linearGradient>
  </defs>

  <!-- Background grid dots (subtle) -->
  <g fill="#7231FF" opacity="0.1">
    <circle cx="40" cy="40" r="2.5"/>
    <circle cx="80" cy="40" r="2.5"/>
    <circle cx="120" cy="40" r="2.5"/>
    <circle cx="160" cy="40" r="2.5"/>
    <circle cx="40" cy="80" r="2.5"/>
    <circle cx="160" cy="80" r="2.5"/>
    <circle cx="40" cy="120" r="2.5"/>
    <circle cx="160" cy="120" r="2.5"/>
    <circle cx="40" cy="160" r="2.5"/>
    <circle cx="80" cy="160" r="2.5"/>
    <circle cx="120" cy="160" r="2.5"/>
    <circle cx="160" cy="160" r="2.5"/>
  </g>

  <!-- Grid connections forming the letter R structure -->
  <g stroke="#7231FF" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <!-- Vertical left stroke -->
    <line x1="60" y1="44" x2="60" y2="156"/>
    <!-- Top horizontal -->
    <line x1="60" y1="44" x2="130" y2="44"/>
    <!-- Right vertical top half -->
    <line x1="130" y1="44" x2="130" y2="100"/>
    <!-- Middle horizontal -->
    <line x1="60" y1="100" x2="130" y2="100"/>
    <!-- Diagonal leg -->
    <line x1="100" y1="100" x2="140" y2="156"/>
  </g>

  <!-- Active nodes on the R letterform -->
  <g fill="#7231FF">
    <!-- Top-left -->
    <circle cx="60" cy="44" r="7"/>
    <!-- Top-right -->
    <circle cx="130" cy="44" r="7"/>
    <!-- Mid-left -->
    <circle cx="60" cy="100" r="7"/>
    <!-- Mid-right -->
    <circle cx="130" cy="100" r="7"/>
    <!-- Bottom-left -->
    <circle cx="60" cy="156" r="7"/>
    <!-- Leg terminus -->
    <circle cx="140" cy="156" r="7"/>
    <!-- Junction node on diagonal -->
    <circle cx="100" cy="100" r="5" fill="#7231FF" opacity="0.6"/>
  </g>

  <!-- Inner glow rings on key nodes -->
  <circle cx="60" cy="44" r="12" fill="none" stroke="#7231FF" stroke-width="1.5" opacity="0.2"/>
  <circle cx="130" cy="100" r="12" fill="none" stroke="#7231FF" stroke-width="1.5" opacity="0.2"/>
  <circle cx="140" cy="156" r="12" fill="none" stroke="#7231FF" stroke-width="1.5" opacity="0.2"/>
</svg>
