<style>
  :root { color-scheme: light; }
  body { margin:0; font:12px/1.5 ui-sans-serif,system-ui,sans-serif; color:#0e0e0e; background:#f5f4ef; }
  header { padding:16px 16px 12px; border-bottom:1px solid #e6e4dd; }
  h1 { margin:0 0 8px; font-size:13px; font-weight:600; }
  p { margin:0; color:#55534c; }
  .bar { display:flex; gap:8px; padding:12px 16px; }
  button { font:inherit; font-weight:600; border-radius:999px; padding:9px 16px; cursor:pointer; border:none; }
  .primary { background:#111113; color:#f5f4ef; }
  .secondary { background:#fff; color:#0e0e0e; border:1px solid #d4d1c7; }
  button:disabled { opacity:.4; pointer-events:none; }
  #score { padding:0 16px; font-weight:600; }
  #score.ok { color:#2f7a4d; } #score.bad { color:#a03c31; }
  pre { margin:0; padding:12px 16px; white-space:pre-wrap; word-break:break-word;
        font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; color:#55534c; }
  .row { padding:6px 16px; border-top:1px solid #efeee8; display:flex; gap:8px; }
  .tag { flex:none; font-weight:600; font-size:10px; padding:1px 6px; border-radius:999px; height:fit-content; }
  .pass { background:#eaf3ec; color:#2f7a4d; } .fail { background:#faf0ee; color:#a03c31; }
  .claim { font-weight:600; } .detail { color:#8a877e; }
</style>

<header>
  <h1>Spike validation</h1>
  <p>Builds probes on the current page, then asserts against the live Figma API.
     Run this in a scratch file.</p>
</header>

<div class="bar">
  <button class="primary" id="run">Run spikes</button>
  <button class="secondary" id="copy" disabled>Copy report</button>
</div>
<div id="score"></div>
<div id="out"></div>

<script>
  let reportText = '';
  const $ = (id) => document.getElementById(id);

  $('run').onclick = () => {
    $('out').innerHTML = '<pre>running…</pre>';
    parent.postMessage({ pluginMessage: { type: 'run-spikes' } }, '*');
  };

  $('copy').onclick = async () => {
    // Figma's iframe blocks navigator.clipboard; the textarea trick still works.
    const ta = document.createElement('textarea');
    ta.value = reportText; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    $('copy').textContent = 'Copied ✓';
    setTimeout(() => ($('copy').textContent = 'Copy report'), 1400);
  };

  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg || msg.type !== 'report') return;
    reportText = msg.text;
    $('copy').disabled = false;
    const ok = msg.passed === msg.total;
    $('score').className = ok ? 'ok' : 'bad';
    $('score').textContent = msg.passed + '/' + msg.total + ' assertions passed';
    $('out').innerHTML = msg.rows.map(r =>
      '<div class="row"><span class="tag ' + (r.pass ? 'pass' : 'fail') + '">' +
      (r.pass ? 'PASS' : 'FAIL') + '</span><div><div class="claim">' +
      esc(r.claim) + '</div><div class="detail">' + esc(r.detail) + '</div></div></div>'
    ).join('');
  };

  function esc(s) {
    return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  }
</script>
