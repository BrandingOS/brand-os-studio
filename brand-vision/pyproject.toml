[project]
name = "brand-vision"
version = "0.1.0"
description = "BrandOS standalone brand-asset image classifier (logo / logotype / logo icon / photo / palette / font specimen / ...)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10.4",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "cairosvg>=2.7",
    "python-multipart>=0.0.9",
    "defusedxml>=0.7",
    "easyocr>=1.7.2",
]

[project.optional-dependencies]
local = [
    "open-clip-torch>=2.24",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "arabic-reshaper>=3.0.1",
    "python-bidi>=0.6.11",
    "ddgs>=9.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brand_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call the real Anthropic API (need ANTHROPIC_API_KEY + BRAND_VISION_LIVE_TESTS=1)",
]
addopts = "-m 'not live'"
