<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brand Vision — Upload Test</title>
<style>
  :root {
    --page: #efede8;
    --card: #ffffff;
    --dash: #d9d6cf;
    --text: #4b4a47;
    --muted: #9b9994;
    --pill: #e9e5dd;
    --btn: #7f7e7a;
    --btn-text: #ffffff;
    --accent: #4b4a47;
    --ok: #4d9e7c;
    --warn: #c2564f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text); min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 24px 96px; }

  /* ---------- upload card (matches onboarding) ---------- */
  .shell { background: var(--card); border-radius: 28px; padding: 18px; box-shadow: 0 1px 2px rgba(60,55,45,.05); }
  .drop {
    border: 2px dashed var(--dash); border-radius: 20px; padding: 56px 32px 40px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: #b9b5ab; background: #faf9f6; }
  .files-illu { display: flex; justify-content: center; margin-bottom: 26px; height: 74px; position: relative; }
  .f-icon {
    width: 58px; height: 70px; background: #fbfaf8; border: 1px solid #e4e1da; border-radius: 8px;
    position: relative; display: flex; align-items: flex-end; justify-content: center;
    box-shadow: 0 4px 10px rgba(80,74,62,.10); color: #b6b3ac; font-size: 9px; font-weight: 600;
    letter-spacing: .5px; padding-bottom: 6px;
  }
  .f-icon::before {
    content: ""; position: absolute; top: 16px; left: 12px; right: 12px; height: 24px;
    background: #e8e5de; border-radius: 4px;
  }
  .f-icon:nth-child(1) { transform: rotate(-10deg) translate(12px, 6px); }
  .f-icon:nth-child(2) { transform: translateY(-2px); z-index: 2; }
  .f-icon:nth-child(3) { transform: rotate(10deg) translate(-12px, 6px); }
  .drop h2 { margin: 0 0 22px; font-size: 19px; font-weight: 400; color: var(--text); }
  .drop h2 u { text-underline-offset: 3px; cursor: pointer; font-weight: 600; }
  .urlbar {
    display: flex; align-items: center; gap: 10px; background: var(--pill);
    border-radius: 999px; padding: 14px 20px; max-width: 560px; margin: 0 auto;
  }
  .urlbar svg { flex: none; opacity: .55; }
  .urlbar input {
    flex: 1; border: none; outline: none; background: transparent; font-size: 15px;
    color: var(--text);
  }
  .urlbar input::placeholder { color: var(--muted); }
  #preview-wrap { display: none; margin-top: 22px; }
  #preview {
    max-height: 110px; max-width: 240px; border-radius: 12px; border: 1px solid var(--dash);
    background: repeating-conic-gradient(#eceae4 0% 25%, #f7f6f2 0% 50%) 0 0 / 16px 16px;
    padding: 6px;
  }
  #fname { color: var(--muted); font-size: 13px; margin-top: 8px; }

  /* ---------- engine picker + action ---------- */
  .picker { text-align: center; margin-top: 34px; }
  .picker .label { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .engines { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .engines button {
    background: var(--card); border: 1px solid var(--dash); color: var(--text);
    padding: 10px 22px; border-radius: 999px; cursor: pointer; font-size: 14px;
    transition: all .12s;
  }
  .engines button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .engines button:disabled { opacity: .35; cursor: not-allowed; }
  .go { text-align: center; margin-top: 30px; }
  .go .hint { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  #run {
    background: var(--btn); color: var(--btn-text); border: none; border-radius: 999px;
    padding: 14px 38px; font-size: 15px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px; transition: background .15s;
  }
  #run:hover:not(:disabled) { background: #6d6c68; }
  #run:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- results ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 40px; }
  .card {
    background: var(--card); border-radius: 20px; padding: 22px;
    box-shadow: 0 1px 2px rgba(60,55,45,.06); border: 1px solid transparent;
  }
  .card.disagree { border-color: #e8c9c6; }
  .card h3 {
    margin: 0 0 14px; font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1.2px; display: flex; justify-content: space-between; font-weight: 600;
  }
  .badge {
    display: inline-block; padding: 6px 16px; border-radius: 999px; background: var(--pill);
    color: var(--text); font-weight: 700; font-size: 15px;
  }
  .conf-bar { height: 5px; border-radius: 4px; background: #efede8; margin: 14px 0 6px; overflow: hidden; }
  .conf-bar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
  .conf-bar i.low { background: var(--warn); }
  .conf-bar i.mid { background: #d5a44a; }
  .meta { color: var(--muted); font-size: 13px; line-height: 1.8; margin-top: 8px; }
  .meta b { color: var(--text); font-weight: 600; }
  .review { color: var(--warn); font-weight: 600; font-size: 13px; margin-top: 10px; }
  .reason { font-size: 13.5px; margin-top: 12px; line-height: 1.6; }
  .style-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .style-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
    border: 1px solid var(--dash); border-radius: 999px; font-size: 12px;
    font-weight: 600; color: var(--text);
  }
  .style-chip small { color: var(--muted); font-weight: 500; }
  .color-names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .color-name {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 5px;
    border: 1px solid var(--dash); border-radius: 999px; font-size: 12px; color: var(--text);
  }
  .color-name i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--dash); }
  .color-name small { color: var(--muted); }
  .detected-text { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .detected-text b { color: var(--ink); }
  details { margin-top: 12px; }
  details summary { color: var(--muted); font-size: 12px; cursor: pointer; }
  pre {
    background: #faf9f6; border: 1px solid #eceae4; border-radius: 10px; padding: 10px;
    font-size: 11px; overflow: auto; max-height: 240px; color: #6b6963;
  }
  .err { color: var(--warn); margin-top: 20px; font-size: 14px; text-align: center; }
  .spin {
    display: inline-block; width: 15px; height: 15px; border: 2px solid #cfccc5;
    border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite;
    vertical-align: -3px; margin-right: 8px;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="shell">
    <div class="drop" id="drop">
      <div class="files-illu">
        <div class="f-icon">PNG</div>
        <div class="f-icon">JPG</div>
        <div class="f-icon">SVG</div>
      </div>
      <h2>Drag &amp; drop image here, <u id="pick">upload file</u> or paste the URL</h2>
      <div class="urlbar" onclick="event.stopPropagation()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b6963" stroke-width="2" stroke-linecap="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <input id="url" type="url" placeholder="Paste a URL" spellcheck="false" />
      </div>
      <div id="preview-wrap">
        <img id="preview" alt="preview" />
        <div id="fname"></div>
      </div>
      <input type="file" id="file" accept="image/*,.svg" hidden />
    </div>
  </div>

  <div class="picker">
    <div class="label">Which model should analyze it?</div>
    <div class="engines" id="engines"></div>
  </div>

  <div class="go">
    <div class="hint" id="hint">Uploaded your image?</div>
    <button id="run" disabled>Analyze <span>→</span></button>
  </div>

  <div class="err" id="err" hidden></div>
  <div class="cards" id="cards"></div>
</main>

<script>
const state = { file: null, url: null, engine: 'all', engines: [] };
const $ = (id) => document.getElementById(id);
const ENGINE_LABELS = { heuristic: 'Heuristic', custom: '★ Our Model', local: 'CLIP', ollama: 'Local VLM', claude: 'Claude', hybrid: 'Hybrid', all: '⚡ Compare all' };

async function loadEngines() {
  const res = await fetch('/engines');
  state.engines = await res.json();
  if (state.engine === 'all' && !state.engines.some(e => e.available && e.name !== 'heuristic')) {
    state.engine = 'heuristic';
  }
  renderEngines();
}
function renderEngines() {
  const wrap = $('engines');
  wrap.innerHTML = '';
  const items = [...state.engines, { name: 'all', available: state.engines.some(x => x.available) }];
  for (const e of items) {
    const b = document.createElement('button');
    b.textContent = ENGINE_LABELS[e.name] || e.name;
    b.disabled = !e.available;
    b.title = e.hint || '';
    b.className = state.engine === e.name ? 'active' : '';
    b.onclick = () => { state.engine = e.name; renderEngines(); };
    wrap.appendChild(b);
  }
}

const drop = $('drop');
drop.onclick = () => $('file').click();
$('pick').onclick = (e) => { e.stopPropagation(); $('file').click(); };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
};
$('file').onchange = (e) => { if (e.target.files[0]) setFile(e.target.files[0]); };
$('url').oninput = (e) => {
  state.url = e.target.value.trim() || null;
  if (state.url) { state.file = null; $('preview-wrap').style.display = 'none'; }
  updateReady();
};
$('url').onkeydown = (e) => { if (e.key === 'Enter' && !$('run').disabled) $('run').click(); };

function setFile(f) {
  state.file = f; state.url = null; $('url').value = '';
  $('preview').src = URL.createObjectURL(f);
  $('preview-wrap').style.display = 'block';
  $('fname').textContent = f.name;
  $('cards').innerHTML = ''; $('err').hidden = true;
  updateReady();
}
function updateReady() {
  const ready = !!(state.file || state.url);
  $('run').disabled = !ready;
  $('hint').textContent = ready ? 'Ready to analyze' : 'Uploaded your image?';
}

$('run').onclick = async () => {
  $('run').disabled = true;
  $('cards').innerHTML = '<div class="card"><span class="spin"></span>Analyzing…</div>';
  $('err').hidden = true;
  try {
    const fd = new FormData();
    if (state.file) fd.append('file', state.file);
    else fd.append('url', state.url);
    fd.append('engine', state.engine);
    const res = await fetch('/classify', { method: 'POST', body: fd });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || res.statusText); }
    const data = await res.json();
    render(state.engine === 'all' ? data : { [state.engine]: data });
  } catch (e) {
    $('cards').innerHTML = '';
    $('err').textContent = '⚠ ' + e.message;
    $('err').hidden = false;
  } finally {
    $('run').disabled = false;
  }
};

function render(map) {
  const entries = Object.entries(map);
  const cats = new Set(entries.map(([, r]) => r.category));
  const disagree = cats.size > 1 && entries.length > 1;
  $('cards').innerHTML = '';
  for (const [name, r] of entries) {
    const pct = Math.round(r.confidence * 100);
    const cls = r.confidence < 0.5 ? 'low' : r.confidence < 0.75 ? 'mid' : '';
    const card = document.createElement('div');
    card.className = 'card' + (disagree ? ' disagree' : '');
    card.innerHTML = `
      <h3><span>${ENGINE_LABELS[name] || name}</span><span>${r.latency_ms} ms</span></h3>
      <span class="badge">${r.category.replaceAll('_', ' ')}</span>
      <div class="conf-bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="meta">
        confidence <b>${pct}%</b><br />
        goes to <b>${r.placement}</b>${r.is_logo ? ` · slot <b>${r.logo_slot ?? '—'}</b>` : ''}
        ${r.model ? `<br />model <b>${r.model}</b>` : ''}
      </div>
      ${r.needs_review ? `<div class="review">⚑ needs review${r.review_reasons.length ? ': ' + escapeHtml(r.review_reasons.join(' · ')) : ''}</div>` : ''}
      ${r.detected_text ? `<div class="detected-text">✎ reads: <b>${escapeHtml(r.detected_text)}</b></div>` : ''}
      ${(r.style_tags?.length ? `<div class="style-chips">${r.style_tags.map((t) =>
        `<span class="style-chip">${escapeHtml(t.label)} <small>${Math.round(t.confidence * 100)}%</small></span>`).join('')}</div>` : '')}
      ${(r.signals?.dominant_color_names?.length ? `<div class="color-names">${r.signals.dominant_color_names.slice(0, 5).map((c) =>
        `<span class="color-name"><i style="background:${escapeHtml(c.hex)}"></i>${escapeHtml(c.en)} <small>${escapeHtml(c.ar)}</small></span>`).join('')}</div>` : '')}
      <div class="reason">${escapeHtml(r.reasoning)}</div>
      <details><summary>measured signals</summary><pre>${escapeHtml(JSON.stringify(r.signals, null, 2))}</pre></details>
    `;
    $('cards').appendChild(card);
  }
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

loadEngines();
</script>
</body>
</html>
