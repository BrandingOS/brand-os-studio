          cpSv.style.background = "hsl(" + cpState.h + ", 100%, 50%)";
          cpSvCursor.style.left = (cpState.s * 100) + "%";
          cpSvCursor.style.top = ((1 - cpState.v) * 100) + "%";
          cpHueCursor.style.left = (cpState.h / 360 * 100) + "%";
          cpPreview.style.background = hex;
          if (document.activeElement !== cpHex) cpHex.value = hex.toUpperCase();
        }

        function setHexFromInput(text) {
          let v = text.trim();
          if (v[0] !== "#") v = "#" + v;
          const rgb = hexToRgb(v);
          if (!rgb) return;
          const [h, s, val] = rgbToHsv(rgb[0], rgb[1], rgb[2]);
          cpState.h = h; cpState.s = s; cpState.v = val;
          updatePicker();
        }

        function dragHandler(el, onMove) {
          function start(e) {
            e.preventDefault();
            move(e);
            function move(ev) {
              const rect = el.getBoundingClientRect();
              const point = ev.touches ? ev.touches[0] : ev;
              const x = Math.max(0, Math.min(rect.width, point.clientX - rect.left));
              const y = Math.max(0, Math.min(rect.height, point.clientY - rect.top));
              onMove(x / rect.width, y / rect.height);
            }
            function end() {
              window.removeEventListener("mousemove", move);
              window.removeEventListener("mouseup", end);
              window.removeEventListener("touchmove", move);
              window.removeEventListener("touchend", end);
            }
            window.addEventListener("mousemove", move);
            window.addEventListener("mouseup", end);
            window.addEventListener("touchmove", move, { passive: false });
            window.addEventListener("touchend", end);
          }
          el.addEventListener("mousedown", start);
          el.addEventListener("touchstart", start, { passive: false });
        }

        dragHandler(cpSv, function (xr, yr) {
          cpState.s = xr;
          cpState.v = 1 - yr;
          updatePicker();
        });
        dragHandler(cpHue, function (xr) {
          cpState.h = xr * 360;
          updatePicker();
        });

        cpHex.addEventListener("input", function () { setHexFromInput(cpHex.value); });
        cpHex.addEventListener("blur", function () { updatePicker(); });

        cpCancel.addEventListener("click", function (e) {
          e.stopPropagation();
          state.editing = false;
          state.editingColorIdx = null;
          wrap.classList.remove("is-editing");
          updateHint();
        });

        cpAdd.addEventListener("click", function (e) {
          e.stopPropagation();
          if (state.selected == null) return;
          const hex = hsvToHex(cpState.h, cpState.s, cpState.v);
          const p = state.palettes[state.selected];
          if (state.editingColorIdx !== null && state.editingColorIdx >= 0) {
            p.colors[state.editingColorIdx] = hex;
          } else {
            p.colors.push(hex);
          }
          state.editing = false;
          state.editingColorIdx = null;
          wrap.classList.remove("is-editing");
          updateHint();
          render();
        });

        /* ---- render ---- */
        function updateHint() {
          if (state.editing) hintText.textContent = "Pick a color";
          else if (state.selected != null) hintText.textContent = "Edit the palette";
          else hintText.textContent = "Tap to focus";
        }

        function openPicker(initialHex, colorIdx) {
          const rgb = hexToRgb(initialHex || "#6b6b70") || [107, 107, 112];
          const [h, s, v] = rgbToHsv(rgb[0], rgb[1], rgb[2]);
          cpState.h = h; cpState.s = s; cpState.v = v;
          updatePicker();
          state.editing = true;
          state.editingColorIdx = (typeof colorIdx === "number") ? colorIdx : null;
          cpAdd.textContent = (state.editingColorIdx !== null) ? "Update" : "Add color";
          wrap.classList.add("is-editing");
          updateHint();
        }

        function resetAll() {
          state.selected = null;
          state.editing = false;
          state.editingColorIdx = null;
          wrap.classList.remove("is-focused", "is-editing");
          updateHint();
          render();
        }

        // Click outside the palette-wrap → full reset
        document.addEventListener("click", function (e) {
          if (!wrap.classList.contains("is-focused")) return;
          if (wrap.contains(e.target)) return;
          resetAll();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && wrap.classList.contains("is-focused")) resetAll();
        });

        function render() {
          grid.innerHTML = "";
          state.palettes.forEach(function (p, idx) {
            const isSelected = state.selected === idx;
            const card = document.createElement("div");
            card.className = "palette-card" + (isSelected ? " is-selected" : "") + (p.locked ? " is-locked" : "");
            card.dataset.idx = idx;

            const strips = document.createElement("div");
            strips.className = "palette-strips";
            p.colors.forEach(function (c) {
              const s = document.createElement("span");
              s.style.background = c;
              strips.appendChild(s);
            });
            card.appendChild(strips);

            // Lock toggle (top-right)
            const lock = document.createElement("button");
            lock.type = "button";
            lock.className = "lock-toggle";
            lock.setAttribute("aria-label", p.locked ? "Unlock palette" : "Lock palette");
            lock.dataset.locked = String(!!p.locked);
            lock.innerHTML =
              '<svg class="lock-glyph-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg>' +
              '<svg class="lock-glyph-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
            lock.addEventListener("click", function (e) {
              e.stopPropagation();
              state.palettes[idx].locked = !state.palettes[idx].locked;
              render();
            });
            card.appendChild(lock);

            const meta = document.createElement("div");
            meta.className = "palette-meta";
            meta.innerHTML =
              '<span class="palette-name">' + p.name + '</span>' +
              '<span class="palette-vibe">' + p.vibe + '</span>';
            card.appendChild(meta);

            const editor = document.createElement("div");
            editor.className = "palette-editor";

            const sw = document.createElement("div");
            sw.className = "swatches";
            p.colors.forEach(function (c, i) {
              const s = document.createElement("button");
              s.type = "button";
              s.className = "swatch";
              s.style.background = c;
              s.setAttribute("aria-label", "Edit color " + c);
              s.addEventListener("click", function (e) {
                e.stopPropagation();
                openPicker(c, i);
              });

              if (p.colors.length > 1) {
                const rm = document.createElement("span");
                rm.className = "swatch-remove";
                rm.setAttribute("role", "button");
                rm.setAttribute("tabindex", "0");
                rm.innerHTML = "×";
                rm.setAttribute("aria-label", "Remove color");
                rm.addEventListener("click", function (e) {
                  e.stopPropagation();
                  state.palettes[idx].colors.splice(i, 1);
                  render();
                });
                s.appendChild(rm);
              }

              sw.appendChild(s);
            });

            if (p.colors.length < 8) {
              const add = document.createElement("button");
              add.className = "swatch-add";
              add.type = "button";
              add.setAttribute("aria-label", "Add a color");
              add.innerHTML = "+";
              add.addEventListener("click", function (e) {
                e.stopPropagation();
                openPicker();
              });
              sw.appendChild(add);
            }

            editor.appendChild(sw);

            const hint = document.createElement("p");
            hint.className = "palette-hint";
            hint.textContent = "Tap any color to edit · + to add · hover × to remove";
            editor.appendChild(hint);

            card.appendChild(editor);

            card.addEventListener("click", function (e) {
              if (e.target.closest(".swatch, .swatch-add, .swatch-remove, input")) return;
              e.stopPropagation();
              if (state.selected === idx) {
                // Deselect and close
                state.selected = null;
                state.editing = false;
                state.editingColorIdx = null;
                wrap.classList.remove("is-focused", "is-editing");
              } else {
                state.selected = idx;
                state.editing = false;
                state.editingColorIdx = null;
                wrap.classList.add("is-focused");
                wrap.classList.remove("is-editing");
              }
              updateHint();
              render();
            });

            grid.appendChild(card);
          });
        }

        updatePicker();
        render();
        updateHint();

        /* ---------- unified shuffle system ---------- */
        function pickUnique(pool, excludeIds) {
          const available = pool.filter(function (p) { return excludeIds.indexOf(p.id) === -1; });
          if (!available.length) return pool[Math.floor(Math.random() * pool.length)];
          return available[Math.floor(Math.random() * available.length)];
        }

        // Per-card font history for variety across shuffles
        if (!styleState.history) styleState.history = {};

        function shuffleStylesFn() {
          // For each unlocked card: pick a new font from its style family pool,
          // avoiding the current selection and recent history for that card.
          styleState.cards.forEach(function (cs) {
            if (cs.locked) return;
            const pool = poolForCard(cs.def, styleState.language);
            if (pool.length <= 1) return;

            const hist = styleState.history[cs.def.id] || [];
            const recentMax = Math.min(Math.max(pool.length - 1, 1), 4);

            // Available indices excluding current + recent history
            const exclude = new Set([cs.fontIdx].concat(hist));
            let candidates = [];
            for (let i = 0; i < pool.length; i++) if (!exclude.has(i)) candidates.push(i);
            // Fallback: allow history repeats if not enough
            if (!candidates.length) {
              for (let i = 0; i < pool.length; i++) if (i !== cs.fontIdx) candidates.push(i);
            }
            // Final fallback: anything
            if (!candidates.length) candidates = [0];

            const nextIdx = candidates[Math.floor(Math.random() * candidates.length)];
            cs.fontIdx = nextIdx;
            styleState.history[cs.def.id] = [nextIdx].concat(hist).slice(0, recentMax);
          });

          // Fade-out unlocked, swap DOM, fade-in
          const cards = Array.from(styleGrid.querySelectorAll(".style-card"));
          cards.forEach(function (c, i) {
            if (!styleState.cards[i].locked) c.classList.add("is-swapping");
          });
          setTimeout(function () {
            cards.forEach(function (oldCard, i) {
              const cs = styleState.cards[i];
              if (cs.locked) return;
              const newCard = buildStyleCard(cs, i);
              newCard.classList.add("is-fresh");
              oldCard.replaceWith(newCard);
              setTimeout(function () { newCard.classList.remove("is-fresh"); }, 380);
            });
          }, 200);
        }

        function shuffleColorsFn() {
          // Preserve locked palettes in their current position
          const lockedIds = state.palettes.filter(function (p) { return p.locked; }).map(function (p) { return p.id; });
          // Shuffled pool minus what's locked AND minus what's currently displayed (to avoid immediate repeats where possible)
          const currentIds = state.palettes.map(function (p) { return p.id; });
          const candidates = PALETTE_POOL.filter(function (p) {
            return lockedIds.indexOf(p.id) === -1;
          });
          // Prefer palettes not currently shown
          const fresh = candidates.filter(function (p) { return currentIds.indexOf(p.id) === -1; });
          const recycled = candidates.filter(function (p) { return currentIds.indexOf(p.id) !== -1; });
          const combined = fresh.concat(recycled);
          // Shuffle
          for (let i = combined.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [combined[i], combined[j]] = [combined[j], combined[i]];
          }
          let k = 0;
          state.palettes = state.palettes.map(function (p) {
            if (p.locked) return p;
            const pick = combined[k % combined.length];
            k++;
            return {
              id: pick.id,
              name: pick.name,
              vibe: pick.vibe,
              colors: [...pick.colors],
              locked: false,
            };
          });
          // Drop selection if the selected palette is no longer in the set
          if (state.selected != null) {
            const selId = state.palettes[state.selected] && state.palettes[state.selected].id;
            if (!selId) {
              state.selected = null;
              state.editing = false;
              wrap.classList.remove("is-focused", "is-editing");
              updateHint();
            }
          }
          render();
        }

        function spin(btn) {
          if (!btn) return;
          btn.classList.add("is-spinning");
          setTimeout(function () { btn.classList.remove("is-spinning"); }, 500);
        }

        const btnShuffleStyles = document.getElementById("shuffle-styles");
        const btnShuffleColors = document.getElementById("shuffle-colors");
        const btnShuffleAll = document.getElementById("shuffle-all");

        if (btnShuffleStyles) btnShuffleStyles.addEventListener("click", function () {
          spin(btnShuffleStyles);
          shuffleStylesFn();
        });
        if (btnShuffleColors) btnShuffleColors.addEventListener("click", function () {
          spin(btnShuffleColors);
          shuffleColorsFn();
        });
        if (btnShuffleAll) btnShuffleAll.addEventListener("click", function () {
          spin(btnShuffleAll);
          shuffleStylesFn();
          shuffleColorsFn();
        });

        /* ---------- step navigation ---------- */
        const panels = {
          1: document.getElementById("panel-1"),
          2: document.getElementById("panel-2"),
        };
        const stepDots = document.querySelectorAll(".step-dot");
        const backBtn = document.getElementById("back-btn");
        const nextBtn = document.getElementById("next-btn");
        const nextLabel = document.getElementById("next-label");
        const titleEl = document.getElementById("step-title");
        const subtitleEl = document.getElementById("step-subtitle");
        const captionEl = document.getElementById("cta-caption");

        const STEP_META = {
          1: {
            title: "Create your Brand",
            subtitle: "Start with the basics — you can always add more later.",
            next: "Continue",
            caption: "Ready to set the vibe?",
          },
          2: {
            title: "Feel your Brand",
            subtitle: "Pick the aesthetic and palette that match how you want to be seen.",
            next: "Finish",
            caption: "Happy with your look?",
          },
        };

        let current = 1;
        function goTo(step) {
          current = step;
          Object.keys(panels).forEach(function (k) {
            panels[k].classList.toggle("is-active", Number(k) === step);
          });
          stepDots.forEach(function (d) {
            const n = Number(d.dataset.step);
            d.classList.toggle("is-active", n === step);
            d.classList.toggle("is-done", n < step);
          });
          backBtn.disabled = step === 1;
          const meta = STEP_META[step];
          titleEl.textContent = meta.title;
          subtitleEl.textContent = meta.subtitle;
          nextLabel.textContent = meta.next;
          if (captionEl) captionEl.textContent = meta.caption;
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        backBtn.addEventListener("click", function () {
          if (current > 1) goTo(current - 1);
        });
        nextBtn.addEventListener("click", function () {
          if (current < 2) {
            goTo(current + 1);
          } else {
            // Finish — subtle flash
            nextBtn.animate(
              [{ transform: "scale(1)" }, { transform: "scale(0.96)" }, { transform: "scale(1)" }],
              { duration: 240, easing: "cubic-bezier(0.22, 0.61, 0.36, 1)" }
            );
          }
        });
      })();
    </script>
  </body>
