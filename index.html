<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand OS — One Setup. Infinite Branded Possibilities.</title>
    <meta name="description" content="Set up your brand once. Auto-apply to every asset—guidelines, designs, print, exports, and a website." />
    <meta name="author" content="Brand OS" />
    <!-- Explicitly declare the page as light-only. This tells the browser
         (and dark-mode extensions like Dark Reader) not to auto-invert the
         page, which was causing the UI to flicker between light and dark
         when the extension and our own styles disagreed on every scroll. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="/" />

    <!-- Icons — generated from the official BrandingOS mark by
         `npm run gen:icons`. The SVG is ink-only and adapts to the browser
         theme; every raster format that cannot adapt carries the brand's
         charcoal tile so the mark reads on a light or a dark tab strip. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@400;500;600;700&family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet" />

    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="Brand OS — One Setup. Infinite Branded Possibilities." />
    <meta property="og:description" content="Set up your brand once. Auto-apply to every asset—guidelines, designs, print, exports, and a website." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
