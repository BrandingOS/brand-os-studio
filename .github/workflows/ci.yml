name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Real application type-check via the ratchet: checks all of src/ (tsconfig.app.json)
      # and fails only on NEW type errors, tolerating the frozen baseline debt
      # (.typecheck-baseline.txt). Replaces the previous no-op `npx tsc --noEmit`
      # (solution tsconfig with files:[] checked zero files). See docs/phase-2/stage-1.
      - name: Type check (ratchet — no new errors)
        run: npm run typecheck:ci

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "## Bundle Size" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js | sort -rh | head -10 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Total: $(du -sh dist/ | cut -f1)" >> $GITHUB_STEP_SUMMARY

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The `browser` Vitest project runs in real Chromium via Playwright, so
      # the browser binary and its system libraries must exist before tests
      # start. Without this the whole run aborts with an unhandled
      # "Executable doesn't exist" error rather than a test failure, which is
      # what made the CI signal unreadable.
      #
      # --with-deps installs the OS packages Chromium needs on ubuntu-latest;
      # only chromium is installed because that is the only browser the suite
      # uses (see vite.config.ts test.projects).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx vitest run --reporter=verbose
